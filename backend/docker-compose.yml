services:
  db:
    image: postgres:16-alpine
    container_name: securelife_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-securelife}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-securelife}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securelife-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: securelife_backend_dev
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-true}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-securelife}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - securelife-network

volumes:
  postgres_data:
    name: securelife_backend_postgres_data
    driver: local

networks:
  securelife-network:
    name: securelife-network
    driver: bridge
